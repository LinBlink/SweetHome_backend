server:
  port: 8084
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: chat-service

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}:8848
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        encode: UTF-8
        namespace: ${NACOS_NAMESPACE}
      discovery:
        namespace: ${NACOS_NAMESPACE}
  config:
    import:
      - file:.env[.properties]
      - nacos:common-spring.yaml
      - nacos:common-logs.yaml
      - nacos:common-mybatis.yaml
      - nacos:common-redis.yaml
      - nacos:chat-service-dubbo.yaml

sh:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  jdbc:
    host: ${MYSQL_SERVER_ADDR}
    password: ${MYSQL_ROOT_PASSWORD}
    database: sh_chat
  nacos:
    server-addr: ${NACOS_SERVER_ADDR}
    namespace: ${NACOS_NAMESPACE}
  ws:
    max-message-length: 2000

jwt:
  public-key: ${JWT_PUBLIC_KEY}

logging:
  level:
    asia.sweethome: debug

