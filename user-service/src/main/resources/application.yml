server:
  port: 8082
  tomcat:
    uri-encoding: UTF-8

spring:

  application:
    name: user-service


  servlet:
    multipart:
      enabled: true
      max-file-size: 60MB
      max-request-size: 500MB
      # 关键！Servlet3 Part文件阈值，超过该值写入磁盘，同时控制内存限制
      file-size-threshold: 10MB

  kafka:
    consumer:
      group-id: user-cache-invalidate-${random.uuid}
      auto-offset-reset: latest
    bootstrap-servers: ${KAFKA_SERVER_ADDR}:${KAFKA_SERVER_PORT}

  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}:8848
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        encode: UTF-8
        namespace: ${NACOS_NAMESPACE}
      discovery:
        namespace: ${NACOS_NAMESPACE}
  config:
    import:
      - file:.env[.properties]
      - nacos:common-mybatis.yaml
      - nacos:common-spring.yaml
      - nacos:common-logs.yaml
      - nacos:common-redis.yaml
      - nacos:user-service-dubbo.yaml

sh:
  redis:
    host: ${REDIS_HOST}
    port: ${REDIS_PORT}
    password: ${REDIS_PASSWORD}
  jdbc:
    host: ${MYSQL_SERVER_ADDR}
    password: ${MYSQL_ROOT_PASSWORD}
    database: sh_user
  nacos:
    server-addr: ${NACOS_SERVER_ADDR}
    namespace: ${NACOS_NAMESPACE}
  r2:
    endpoint: ${R2_S3_API_ENDPOINT}
    access-key-id: ${R2_ACCESS_KEY_ID}
    secret-access-key: ${R2_SECRET_ACCESS_KEY}
    bucket-name: ${R2_BUCKET_NAME}
    public-base-url: ${R2_PUBLIC_BASE_URL}
  jpush:
    app-key: ${JGTS_APP_KEY}
    master-secret: ${JGTS_MASTER_SECRET}


logging:
  level:
    asia.sweethome: debug

