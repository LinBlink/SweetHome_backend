services:
  # ===== 基础设施 =====
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
      # 4G 预算下进一步收窄，standalone 模式够用
      JVM_XMS: 512m
      JVM_XMX: 768m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 2g   # ≈ JVM_XMX(256m) × 1.25，standalone 元数据量小，余量可以收紧
          cpus: "0.5"

  mysql:
    image: mysql:8.0.36
    container_name: mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./docker/mysql/mysql-init:/docker-entrypoint-initdb.d
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - backend_network

  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD}
    # 4G 预算下 maxmemory 收到 128mb，chat-service 的 Pub/Sub 消息体本身很小，够用
    command: redis-server --maxmemory 128mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 192m   # ≈ maxmemory(128mb) + 持久化/连接开销余量
          cpus: "0.3"

  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      # 单节点 KRaft，本地开发吞吐量低，堆没必要给到 512m
      KAFKA_HEAP_OPTS: "-Xms192m -Xmx256m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      # 单分区场景下页缓存/日志段没必要预留太多，缩小段大小减少常驻内存
      KAFKA_LOG_SEGMENT_BYTES: 268435456
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend_network

  # Kafka GUI，纯调试工具，日常不需要常驻，用 profile 隔离，需要看 topic 时再启：
  # docker compose --profile debug up -d kafdrop
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    profiles: ["debug"]
    ports:
      - "9000:9000"
    environment:
      KAFKA_BROKERCONNECT: "kafka:29092"
      SERVER_SERVLET_CONTEXTPATH: "/"
    restart: unless-stopped
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 160m
          cpus: "0.3"

  # ===== 业务微服务 =====
  # 统一约定：JAVA_OPTS 需要 Dockerfile 的 ENTRYPOINT 用 `sh -c "java $JAVA_OPTS -jar app.jar"`
  # 这种形式读取环境变量才会生效，如果是写死的 `java -jar app.jar` 需要先改 Dockerfile。
  # -XX:+UseSerialGC + -XX:ActiveProcessorCount=1：容器只分到 <1 核时，G1 的多 GC 线程反而是负担
  # -XX:+ExitOnOutOfMemoryError：内存不够时让容器直接重启，而不是卡死在一个不可用状态

  gateway:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    container_name: gateway
    build: { context: ., args: { MODULE: gateway } }
    env_file:
      - .env
    ports:
      - "8080:8080"

  auth-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: auth-service
    build: { context: ., args: { MODULE: auth-service } }

  user-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: user-service
    build: { context: ., args: { MODULE: user-service } }

  family-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: family-service
    build: { context: ., args: { MODULE: family-service } }

  chat-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: chat-service
    build: { context: ., args: { MODULE: chat-service } }

  location-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: location-service
    build: { context: ., args: { MODULE: location-service } }

  moment-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: moment-service
    build: { context: ., args: { MODULE: moment-service } }

  health-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: health-service
    build: { context: ., args: { MODULE: health-service } }

  redpacket-service:
    restart: unless-stopped
    networks:
      - backend_network
    volumes:
      - ./.env:/app/.env:ro
    environment:
      JAVA_OPTS: >-
        -Xms256m -Xmx512m
    depends_on:
      mysql: { condition: service_healthy }
      redis: { condition: service_healthy }
    env_file:
      - .env
    container_name: redpacket-service
    build: { context: ., args: { MODULE: redpacket-service } }


volumes:
  mysql_data:
  redis_data:
  kafka_data:

networks:
  backend_network:
    driver: bridge