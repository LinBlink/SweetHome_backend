version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.4.3
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
      # 官方镜像支持这几个变量显式收窄堆大小，不给默认的自动探测值（会按宿主机内存算，白白吃掉几个G）
      JVM_XMS: 256m
      JVM_XMX: 512m
      JVM_XMN: 256m
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 768m   # ≈ JVM_XMX(512m) × 1.5，留堆外内存余量
          cpus: "1.0"
#  防止docker卡死，设置healthcheck

#  部署mysql 的最佳实践
  mysql:
    image: mysql:8.0.36 # 1. 指定具体版本，避免使用 latest
    container_name: mysql
    restart: always # 2. 生产环境建议设置为 always 或 unless-stopped

    # 3. 环境变量管理（敏感信息推荐从 .env 文件读取）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai # 设置容器时区

    # 4. 端口映射（如果仅内部服务访问，可省略 ports，改用 expose）
    ports:
      - "3306:3306"

    # 5. 数据持久化与配置挂载
    volumes:
      - mysql_data:/var/lib/mysql # 数据文件
      - ./docker/mysql/mysql-init:/docker-entrypoint-initdb.d # 首次启动自动执行 doc/schema.sql 建表

    # 7. 健康检查（极为重要！）
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # 给数据库初始化留出足够的时间
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 512m   # 本地开发数据量小，默认 innodb_buffer_pool_size(128m) 就够，留够堆外/连接开销即可
          cpus: "1.0"

  # chat-service 多实例 WebSocket 广播 / 在线状态依赖 Redis Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    # 显式给 Redis 自己设内存上限，让它按 LRU 优雅淘汰 key，而不是被容器 mem_limit 硬 OOM Kill
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 384m   # ≈ maxmemory(256mb) + 堆外/持久化开销余量
          cpus: "0.5"

  # user-service 多实例广播 L1 缓存失效 / 事件驱动依赖 Kafka
  # KRaft 模式:单节点同时兼任 broker + controller，不再需要 Zookeeper（面试题 192）
  kafka:
    image: apache/kafka:3.9.0
    container_name: kafka
    hostname: kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_HEAP_OPTS: "-Xms256m -Xmx512m"
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      # 三个监听口:9092 给宿主机客户端、29092 给容器内客户端、9093 给 controller 选举
      KAFKA_LISTENERS: PLAINTEXT://:9092,INTERNAL://:29092,CONTROLLER://:9093
      # 广播地址:两种客户端各拿各的
      #   宿主机(user-service)→ localhost:9092
      #   容器(kafdrop 等)     → kafka:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092,INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    restart: unless-stopped
    volumes:
      - kafka_data:/var/lib/kafka/data
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 768m
          cpus: "1.0"

  # Kafka GUI(浏览器 http://localhost:9000 看 topic / 消息)
  kafdrop:
    image: obsidiandynamics/kafdrop
    container_name: kafdrop
    ports:
      - "9000:9000"
    environment:
      # kafdrop 在容器网络里，走 INTERNAL 广播地址 kafka:29092（不是 9092）
      KAFKA_BROKERCONNECT: "kafka:29092"
      SERVER_SERVLET_CONTEXTPATH: "/"
    restart: unless-stopped
    networks:
      - backend_network
    deploy:
      resources:
        limits:
          memory: 256m   # 只是个查看 topic 的轻量 Web UI，够用
          cpus: "0.5"

# 定义持久化卷
volumes:
  mysql_data:
  redis_data:
  kafka_data:

# 定义安全网络
networks:
  backend_network:
    driver: bridge