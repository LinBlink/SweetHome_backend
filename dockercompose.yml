version: '3.8'

services:
  nacos:
    image: nacos/nacos-server:v2.3.2
    container_name: nacos
    restart: always
    environment:
      MODE: standalone
    ports:
      - "8848:8848"
      - "9848:9848"
    networks:
      - backend_network

#  部署mysql 的最佳实践
  mysql:
    image: mysql:8.0.36 # 1. 指定具体版本，避免使用 latest
    container_name: mysql
    restart: always # 2. 生产环境建议设置为 always 或 unless-stopped

    # 3. 环境变量管理（敏感信息推荐从 .env 文件读取）
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: Asia/Shanghai # 设置容器时区

    # 4. 端口映射（如果仅内部服务访问，可省略 ports，改用 expose）
    ports:
      - "3306:3306"

    # 5. 数据持久化与配置挂载
    volumes:
      - mysql_data:/var/lib/mysql # 数据文件
      - ./docker/mysql/mysql-init:/docker-entrypoint-initdb.d # 首次启动自动执行 doc/schema.sql 建表

    # 7. 健康检查（极为重要！）
    healthcheck:
      test: [ "CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${MYSQL_ROOT_PASSWORD}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s # 给数据库初始化留出足够的时间
    networks:
      - backend_network

  # chat-service 多实例 WebSocket 广播 / 在线状态依赖 Redis Pub/Sub
  redis:
    image: redis:7-alpine
    container_name: redis
    restart: always
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: [ "CMD", "redis-cli", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - backend_network

# 定义持久化卷
volumes:
  mysql_data:
  redis_data:

# 定义安全网络
networks:
  backend_network:
    driver: bridge