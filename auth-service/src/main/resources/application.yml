server:
  port: 8081
  tomcat:
    uri-encoding: UTF-8

spring:
  application:
    name: auth
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR}:8848
      config:
        group: DEFAULT_GROUP
        file-extension: yaml
        namespace: ${NACOS_NAMESPACE}
      discovery:
        namespace: ${NACOS_NAMESPACE}
  config:
    import:
      - optional:file:.env[.properties]
      - optional:nacos:common-spring.yaml
      - optional:nacos:common-logs.yaml

sh:
  jdbc:
    database: sh_auth

logging:
  level:
    asia.sweethome: debug
